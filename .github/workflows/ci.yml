name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: build, vet, test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [order-service, inventory-service, notification-service]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: services/${{ matrix.service }}/go.sum

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      # order-service and inventory-service are the two with a repository/
      # package that talks to a real datastore (Postgres, MongoDB) — their
      # integration tests spin up the real thing via testcontainers-go,
      # gated behind the `integration` build tag so the step above stays
      # fast and Docker-free. notification-service has no repository package.
      # cmd/server's connectPostgres/connectMongo retry-until-ready loops
      # get the same treatment: a real (throwaway) container instead of
      # mocking the driver.
      - name: go test (integration)
        if: matrix.service == 'order-service' || matrix.service == 'inventory-service'
        run: go test -tags=integration -race -coverprofile=coverage-integration.out -covermode=atomic ./internal/repository/... ./cmd/server/...

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: services/${{ matrix.service }}/coverage.out,services/${{ matrix.service }}/coverage-integration.out
          flags: ${{ matrix.service }}
          fail_ci_if_error: false

  docker-build:
    name: docker build (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        service: [order-service, inventory-service, notification-service]
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t ${{ matrix.service }}:${{ github.sha }} ./services/${{ matrix.service }}
