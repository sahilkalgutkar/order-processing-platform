comment:
  layout: "condensed_header, diff, flags, condensed_files"
  behavior: default
  require_changes: false

coverage:
  status:
    project:
      default:
        target: 80%
    patch:
      default:
        target: 80%

flags:
  order-service:
    paths:
      - services/order-service/
  inventory-service:
    paths:
      - services/inventory-service/
  notification-service:
    paths:
      - services/notification-service/
